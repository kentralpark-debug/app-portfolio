name: Auto Update App Portfolio Website

on:
  schedule:
    - cron: '0 0 * * *'  # 毎日深夜0時に自動実行（必要に応じて変更可能）
  workflow_dispatch:      # GitHub画面から手動実行も可能

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run site generator
        run: python3 generate_site.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update generated site files via GitHub Actions"
          branch: main
